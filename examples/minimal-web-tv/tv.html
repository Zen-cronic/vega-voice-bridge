<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tv-voice-bridge: minimal TV</title>
    <style>
      body { margin: 0; background: #0b0d11; color: #f4f6f8; font: 32px/1.4 system-ui, sans-serif; padding: 54px 96px; }
      #code { font-size: 120px; font-weight: 800; letter-spacing: 24px; }
      #heard { font-size: 64px; font-weight: 700; margin-top: 40px; min-height: 90px; }
      #partial { color: #9aa4b2; font-style: italic; min-height: 50px; }
      #say { color: #ffcf33; margin-top: 40px; min-height: 50px; }
      small { color: #6b7684; }
    </style>
  </head>
  <body>
    <small>Open this on the phone (same Wi-Fi):</small>
    <div id="join">connecting…</div>
    <div id="code">····</div>
    <div id="partial"></div>
    <div id="heard">Say something into the phone.</div>
    <div id="say"></div>
    <small id="status">Press any key once so the browser allows speech.</small>
    <script type="module">
      import { BridgeClient } from '/lib/index.js';
      const $ = (id) => document.getElementById(id);
      const tv = new BridgeClient({ url: `ws://${location.host}/ws`, role: 'screen', code: sessionStorage.getItem('code') ?? undefined });
      tv.on('welcome', (w) => { sessionStorage.setItem('code', w.code); $('code').textContent = w.code; $('join').textContent = w.joinUrl; });
      tv.on('status', (s) => ($('status').textContent = s === 'open' ? 'Connected.' : s === 'reconnecting' ? 'Hub offline, retrying…' : s));
      tv.on('transcript.partial', (m) => ($('partial').textContent = m.text));
      tv.on('intent', (m) => {
        const receivedAt = performance.timeOrigin + performance.now();
        $('partial').textContent = '';
        $('heard').textContent = `“${m.payload.text}”`;
        requestAnimationFrame(() => tv.ack(m, { receivedAt })); // after the frame that shows it
      });

      // TV -> room speech: one queue. "high" interrupts and clears it; "playing" is reported when sound starts.
      const queue = [];
      let current = null;
      const report = (id, state, detail) => tv.reportSay({ id, state, detail });
      function stopCurrent() {
        if (!current) return;
        const { id, stop } = current;
        current = null;
        stop();
        report(id, 'interrupted');
      }
      function playNext() {
        if (current || !queue.length) return;
        const line = queue.shift();
        $('say').textContent = line.text;
        const done = (state, detail) => {
          if (current?.id !== line.id) return;
          current = null;
          report(line.id, state, detail);
          playNext();
        };
        if (line.audioUrl) {
          const a = new Audio(line.audioUrl);
          current = { id: line.id, stop: () => a.pause() };
          report(line.id, 'loading');
          a.onplaying = () => report(line.id, 'playing');
          a.onended = () => done('ended');
          a.onerror = () => done('error', 'audio failed to load');
          a.play().catch((e) => done('error', String(e)));
        } else if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance(line.text);
          current = { id: line.id, stop: () => speechSynthesis.cancel() };
          u.onstart = () => report(line.id, 'playing');
          u.onend = () => done('ended');
          u.onerror = (e) => done('error', e.error);
          speechSynthesis.speak(u);
        } else {
          let timer = 0;
          current = { id: line.id, stop: () => clearTimeout(timer) };
          report(line.id, 'no-audio');
          timer = setTimeout(() => done('ended'), line.durationMs);
        }
      }
      tv.onSay((line) => {
        if (line.priority === 'high') {
          queue.length = 0;
          stopCurrent();
        }
        queue.push(line);
        playNext();
      });
      tv.connect().catch(() => undefined); // keeps retrying in the background
    </script>
  </body>
</html>
